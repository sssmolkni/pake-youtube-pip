name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # postinstall runs scripts/patch-pake.mjs, so this also proves every
      # patch in patches/ still applies to the pinned pake-cli.
      - run: npm ci
      - run: npm run check
